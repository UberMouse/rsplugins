---
# selene standard library for RS3 client plugins: the Lua 5.4 grammar and the stdlib members
# selene's lua53 std lacks. The Client Plugin API is not declared here: LuaLS checks API
# names, members and argument types against the stubs in docs/api/ (scripts/check.sh step 5),
# so selene's undefined_variable is off (selene.toml) and this file stays small.
name: rs
lua_versions:
  - lua51
  - lua52
  - lua53
  - lua54
globals:
  # Lua 5.3/5.4 stdlib members selene's lua53 std lacks.
  math.type:
    args:
      - type: any
  math.tointeger:
    args:
      - type: any
  math.ult:
    args:
      - type: number
      - type: number
  warn:
    args:
      - type: "..."
  coroutine.close:
    args:
      - type: any

  # Lifecycle hooks the client calls when a plugin defines them as globals
  # (docs/plugin-anatomy.md). Plugins assign these, so they must be writable.
  PluginShutdown:
    property: full-write
  PluginDependencyUpdate:
    property: full-write
